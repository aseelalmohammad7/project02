<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 02 - Colors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Color Models</h1>

    <section class="palette">

        <div class="swatch named">
            <h2>Named</h2>
            <p>Tomato</p>
        </div>

        <div class="swatch hex">
            <h2>HEX</h2>
            <p>#3498db</p>
        </div>

        <div class="swatch rgb">
            <h2>RGB</h2>
            <p>rgb(46, 204, 113)</p>
        </div>

        <div class="swatch rgba">
            <h2>RGBA</h2>
            <p>rgba(155, 89, 182, 0.5)</p>
        </div>

    </section>

    <section class="comparison">

        <div class="opacity-box">
            <h2>opacity: 0.5</h2>
            <p>This text is also affected by opacity.</p>
        </div>

        <div class="rgba-box">
            <h2>RGBA Background</h2>
            <p>This text remains fully visible.</p>
        </div>

    </section>

</body>
</html>
