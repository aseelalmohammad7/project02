<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 02 - CSS Shapes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Shapes</h1>

    <div class="shapes">

        <div class="shape-item">
            <h2>Square</h2>
            <div class="square"></div>
        </div>

        <div class="shape-item">
            <h2>Rectangle</h2>
            <div class="rectangle"></div>
        </div>

        <div class="shape-item">
            <h2>Circle</h2>
            <div class="circle"></div>
        </div>

        <div class="shape-item">
            <h2>Pill</h2>
            <div class="pill"></div>
        </div>

        <div class="shape-item">
            <h2>Triangle</h2>
            <div class="triangle"></div>
        </div>

    </div>

</body>
</html>
