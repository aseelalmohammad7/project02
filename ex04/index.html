<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 02 - Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Box Model</h1>

    <main class="comparison">

        <section>
            <h2>content-box</h2>

            <div class="box content-box">
                <h3>Content Box</h3>
                <p>Width excludes padding and border.</p>
            </div>
        </section>

        <section>
            <h2>border-box</h2>

            <div class="box border-box">
                <h3>Border Box</h3>
                <p>Width includes padding and border.</p>
            </div>
        </section>

    </main>

</body>
</html>
